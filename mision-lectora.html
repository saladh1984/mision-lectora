<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Misión Lectora</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Baloo+2:wght@500;600;700;800&display=swap">
<style>
:root{
  --bg:#EDF1F7; --surface:#FFFFFF; --surface-2:#F5F7FB; --ink:#16203A; --ink-2:#4B5673; --ink-3:#7A849C; --line:#D8DFEB;
  --brand:#1E3A8A; --brand-ink:#FFFFFF; --sun:#F4B400; --sun-bg:#FFF4CC; --sun-ink:#5A4200;
  --loc:#2563EB; --loc-bg:#E2EBFF; --inf:#8338D6; --inf-bg:#F0E5FC; --ref:#D4560B; --ref-bg:#FFEADB; --sin:#0A8659; --sin-bg:#DAF4E8;
  --ok:#157A3A; --ok-bg:#DDF7E6; --bad:#BE2A20; --bad-bg:#FDE4E1;
  --pista:#FFE27A; --pista-ink:#16203A;
  --r:#0E7490; --i:#C2410C; --c:#15803D; --e:#7E22CE;
  --k-dato:#2563EB; --k-causa:#0E7490; --k-contraste:#D12D2D; --k-opinion:#D4560B; --k-otraop:#9A6A00; --k-argumento:#BE185D; --k-idea:#C99700; --k-inferencia:#7C3AED; --k-vocab:#DB2777; --k-grafico:#0F766E;
  --bar:#8DA6D8; --bar-hl:#F4B400;
  --shadow:0 1px 2px rgba(22,32,58,.06), 0 6px 18px rgba(22,32,58,.07);
  --radius:16px;
  --f-display:"Baloo 2", "Trebuchet MS", system-ui, sans-serif;
  --f-body:"Atkinson Hyperlegible", Verdana, system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0E1424; --surface:#172036; --surface-2:#1E2842; --ink:#E9EEF8; --ink-2:#AEB8CF; --ink-3:#7F8AA5; --line:#2B3754;
    --brand:#8FA8FF; --brand-ink:#0E1424; --sun:#FFC933; --sun-bg:#3A300F; --sun-ink:#FFE08A;
    --loc:#7EA4FF; --loc-bg:#1C2B52; --inf:#C29BFF; --inf-bg:#2E2150; --ref:#FF9A5A; --ref-bg:#43261A; --sin:#4FD6A1; --sin-bg:#123A2D;
    --ok:#5BD98A; --ok-bg:#133A25; --bad:#FF8A80; --bad-bg:#472020;
    --pista:#FFD84D; --pista-ink:#16203A;
    --r:#4FC3DC; --i:#FF9A5A; --c:#5BD98A; --e:#C29BFF;
    --k-dato:#7EA4FF; --k-causa:#4FC3DC; --k-contraste:#FF7B7B; --k-opinion:#FF9A5A; --k-otraop:#E8C050; --k-argumento:#FF77B8; --k-idea:#FFD84D; --k-inferencia:#C29BFF; --k-vocab:#FF85C0; --k-grafico:#4FD1C5;
    --bar:#4A6199; --bar-hl:#FFC933;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 6px 18px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
    color-scheme:dark;
    --bg:#0E1424; --surface:#172036; --surface-2:#1E2842; --ink:#E9EEF8; --ink-2:#AEB8CF; --ink-3:#7F8AA5; --line:#2B3754;
    --brand:#8FA8FF; --brand-ink:#0E1424; --sun:#FFC933; --sun-bg:#3A300F; --sun-ink:#FFE08A;
    --loc:#7EA4FF; --loc-bg:#1C2B52; --inf:#C29BFF; --inf-bg:#2E2150; --ref:#FF9A5A; --ref-bg:#43261A; --sin:#4FD6A1; --sin-bg:#123A2D;
    --ok:#5BD98A; --ok-bg:#133A25; --bad:#FF8A80; --bad-bg:#472020;
    --pista:#FFD84D; --pista-ink:#16203A;
    --r:#4FC3DC; --i:#FF9A5A; --c:#5BD98A; --e:#C29BFF;
    --k-dato:#7EA4FF; --k-causa:#4FC3DC; --k-contraste:#FF7B7B; --k-opinion:#FF9A5A; --k-otraop:#E8C050; --k-argumento:#FF77B8; --k-idea:#FFD84D; --k-inferencia:#C29BFF; --k-vocab:#FF85C0; --k-grafico:#4FD1C5;
    --bar:#4A6199; --bar-hl:#FFC933;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 6px 18px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:18px;line-height:1.55;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
h1,h2,h3,h4{font-family:var(--f-display);line-height:1.15;text-wrap:balance;margin:0}
h1{font-size:2.1rem;font-weight:800}
h2{font-size:1.6rem;font-weight:800}
h3{font-size:1.25rem;font-weight:700}
h4{font-size:1.05rem;font-weight:700}
p{margin:0}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px;border-radius:6px}
.boot{padding:40px 16px;font-family:var(--f-display);font-size:1.3rem;color:var(--ink-2);text-align:center}

/* ---------- Estructura ---------- */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:10px 16px}
.logo{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:800;font-size:1.25rem;color:var(--brand);background:none;border:0;cursor:pointer;padding:0}
.logo-mark{width:34px;height:34px;border-radius:10px;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;font-size:1.1rem}
.top-spacer{flex:1}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 12px;font-size:.88rem;font-weight:700;background:var(--surface-2);border:1px solid var(--line);white-space:nowrap}
.chip.sun{background:var(--sun-bg);color:var(--sun-ink);border-color:transparent}
.btn-menu{display:none;border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:6px 12px;cursor:pointer;font-weight:700}
.layout{display:grid;grid-template-columns:260px minmax(0,1fr);min-height:calc(100vh - 60px)}
.side{border-right:1px solid var(--line);background:var(--surface);padding:16px 12px;position:sticky;top:60px;align-self:start;height:calc(100vh - 60px);overflow:auto}
.side nav{display:flex;flex-direction:column;gap:2px}
.nav-item{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:none;padding:9px 12px;border-radius:10px;cursor:pointer;font-size:1rem;color:var(--ink)}
.nav-item:hover{background:var(--surface-2)}
.nav-item.on{background:var(--brand);color:var(--brand-ink);font-weight:700}
.nav-item .ico{width:26px;text-align:center}
.nav-item .etq{margin-left:auto;font-size:.7rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;opacity:.7}
.side-foot{margin-top:18px;padding-top:14px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.main{padding-block:24px 80px;padding-inline:clamp(16px,3vw,40px);max-width:1180px;width:100%}
.drawer-bg{position:fixed;inset:0;background:rgba(10,15,30,.45);z-index:40}
.drawer{position:fixed;top:0;bottom:0;left:0;width:min(300px,86vw);background:var(--surface);z-index:41;padding:calc(16px + env(safe-area-inset-top,0px)) 12px 16px;overflow:auto;box-shadow:var(--shadow)}
@media (max-width:980px){
  .layout{grid-template-columns:minmax(0,1fr)}
  .side{display:none}
  .btn-menu{display:inline-block}
  .hide-sm{display:none}
}

/* ---------- Piezas ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow)}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.grid-2{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(min(100%,360px),1fr))}
.muted{color:var(--ink-2)}
.small{font-size:.9rem}
.eyebrow{font-size:.78rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.page-head{display:flex;flex-direction:column;gap:6px;margin-bottom:22px}
.page-head p{color:var(--ink-2);max-width:65ch}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:12px;padding:10px 18px;font-weight:700;cursor:pointer;border:2px solid transparent;background:var(--brand);color:var(--brand-ink);font-size:1rem;text-decoration:none;transition:transform .12s ease}
.btn:active{transform:scale(.97)}
.btn.sec{background:var(--surface);color:var(--ink);border-color:var(--line)}
.btn.sun{background:var(--sun);color:#2B2000}
.btn.ghost{background:none;color:var(--brand);border-color:transparent;padding-inline:8px}
.btn.big{font-size:1.2rem;padding:14px 24px;border-radius:14px;font-family:var(--f-display)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.back{margin-bottom:12px}
.skill-chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 12px;font-weight:700;font-size:.85rem;background:var(--hb);color:var(--hc)}
.lvl{display:inline-flex;gap:3px;align-items:center;font-size:.82rem;color:var(--ink-2);font-weight:700}
.lvl i{width:9px;height:9px;border-radius:50%;background:var(--line);display:inline-block}
.lvl i.on{background:var(--sun)}
.bar{height:12px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden}
.bar > span{display:block;height:100%;border-radius:999px;background:var(--hc,var(--brand));transition:width .5s ease}
.pill-ok{color:var(--ok);font-weight:700}

/* ---------- Inicio ---------- */
.hero{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:20px;align-items:stretch}
.hero-main{background:var(--brand);color:var(--brand-ink);border-radius:22px;padding:28px;display:flex;flex-direction:column;gap:14px;position:relative;overflow:hidden}
.hero-main h1{font-size:2.4rem}
.hero-main p{opacity:.92;max-width:48ch}
.hero-lines{position:absolute;inset:0;background-image:repeating-linear-gradient(to bottom,transparent 0 33px,rgba(255,255,255,.08) 33px 34px);pointer-events:none}
.count{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:22px;display:flex;flex-direction:column;gap:10px;box-shadow:var(--shadow)}
.count-nums{display:flex;gap:12px;flex-wrap:wrap}
.count-box{flex:1;min-width:70px;background:var(--sun-bg);border-radius:14px;padding:10px;text-align:center}
.count-box b{display:block;font-family:var(--f-display);font-size:2.3rem;line-height:1;color:var(--sun-ink);font-variant-numeric:tabular-nums}
.count-box span{font-size:.85rem;color:var(--sun-ink);font-weight:700}
@media (max-width:760px){.hero{grid-template-columns:minmax(0,1fr)} .hero-main h1{font-size:2rem}}
.skill-card{border-top:5px solid var(--hc)}
.skill-card h3{display:flex;align-items:center;gap:8px}
.medals{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.medal{border:1px dashed var(--line);border-radius:14px;padding:12px;text-align:center;display:flex;flex-direction:column;gap:4px;align-items:center;background:var(--surface)}
.medal .m-ico{font-size:1.9rem;filter:grayscale(1);opacity:.35}
.medal.on{border-style:solid;border-color:var(--sun);background:var(--sun-bg)}
.medal.on .m-ico{filter:none;opacity:1}
.medal b{font-family:var(--f-display);font-size:1rem;line-height:1.1}
.medal small{font-size:.78rem;color:var(--ink-2);line-height:1.25}

/* ---------- Textos ---------- */
.texto{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:22px 24px;font-size:1.08rem;line-height:1.75}
.texto p{margin-bottom:14px;max-width:68ch}
.texto h3{font-size:1.4rem;margin:2px 0 10px}
.texto-tipo{font-size:.78rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.texto .autor{font-style:italic;color:var(--ink-2);margin:-4px 0 12px;font-size:.95rem}
.texto .fuente{font-size:.85rem;color:var(--ink-3);border-top:1px solid var(--line);padding-top:8px;margin-top:6px}
mark.pista{background:var(--pista);color:var(--pista-ink);border-radius:4px;padding:1px 2px;box-shadow:0 0 0 2px var(--pista);animation:glow 1.2s ease 1}
@keyframes glow{0%{box-shadow:0 0 0 8px rgba(244,180,0,.5)}100%{box-shadow:0 0 0 2px var(--pista)}}
.clave{display:inline;font:inherit;line-height:inherit;border:0;padding:1px 2px;margin:0;cursor:pointer;color:inherit;background:color-mix(in srgb,var(--k) 16%,transparent);border-bottom:3px solid var(--k);border-radius:4px}
.clave:hover,.clave.on{background:color-mix(in srgb,var(--k) 32%,transparent)}
.clave.idea{background:color-mix(in srgb,var(--k-idea) 38%,transparent)}
.oracion{cursor:pointer;border-radius:4px;padding:1px 0;transition:background .15s}
.oracion:hover{background:var(--surface-2);box-shadow:0 0 0 1px var(--line)}
.oracion.ok{background:var(--ok-bg);box-shadow:0 0 0 2px var(--ok)}
.oracion.bad{background:var(--bad-bg);box-shadow:0 0 0 2px var(--bad)}
.probar-aviso{background:var(--sun-bg);color:var(--sun-ink);border-radius:10px;padding:8px 12px;font-weight:700;font-size:.95rem;margin-bottom:12px}
.leyenda{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.leyenda span{font-size:.82rem;font-weight:700;padding:3px 10px;border-radius:999px;background:color-mix(in srgb,var(--k) 16%,transparent);border-bottom:3px solid var(--k)}
.tabs{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:4px;gap:4px}
.tabs button{border:0;background:none;padding:8px 16px;border-radius:9px;cursor:pointer;font-weight:700;color:var(--ink-2)}
.tabs button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.nota-sheet{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));width:min(620px,calc(100% - 32px));background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--k);border-radius:16px;box-shadow:0 12px 40px rgba(0,0,0,.25);padding:16px 18px;z-index:50;animation:up .22s ease}
@keyframes up{from{transform:translate(-50%,16px);opacity:0}to{transform:translate(-50%,0);opacity:1}}
.nota-sheet .n-tipo{font-size:.78rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--k)}
.nota-sheet .n-frag{font-family:var(--f-display);font-weight:700;font-size:1.1rem;margin:2px 0 6px}
.nota-x{position:absolute;top:8px;right:10px;border:0;background:var(--surface-2);border-radius:8px;width:32px;height:32px;cursor:pointer;font-size:1.1rem}
.grafico{margin:8px 0 18px;overflow-x:auto}
.grafico svg{width:100%;min-width:320px;height:auto;display:block}
.g-tit{font-family:var(--f-display);font-weight:700;font-size:17px;fill:var(--ink)}
.g-tick{font-size:13px;fill:var(--ink-2);font-family:var(--f-body)}
.g-lab{font-size:13.5px;fill:var(--ink);font-family:var(--f-body);font-weight:700}
.g-eje{font-size:13px;fill:var(--ink-2);font-family:var(--f-body);font-style:italic}
.g-grid{stroke:var(--line);stroke-width:1}
.g-val{font-size:14px;font-weight:700;fill:var(--ink);font-family:var(--f-display)}
.g-bar{fill:var(--bar);transition:fill .2s}
.g-bar.hl{fill:var(--bar-hl)}
.g-bar.click{cursor:pointer}
.g-bar.click:hover{fill:var(--brand)}
.g-badge{cursor:pointer}
.g-badge circle{fill:var(--k-grafico);stroke:var(--surface);stroke-width:3}
.g-badge text{fill:#fff;font-weight:700;font-size:13px;font-family:var(--f-body)}

/* ---------- Ejercicios ---------- */
.ex-grid{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:20px;align-items:start}
.ex-texto{position:sticky;top:76px;max-height:calc(100vh - 96px);overflow:auto;border-radius:var(--radius)}
@media (max-width:980px){.ex-grid{grid-template-columns:minmax(0,1fr)} .ex-texto{position:static;max-height:none}}
.q-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:20px;display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow)}
.q-text{font-family:var(--f-display);font-size:1.3rem;font-weight:700;line-height:1.3}
.ops{display:flex;flex-direction:column;gap:10px}
.op{display:flex;gap:12px;align-items:flex-start;text-align:left;border:2px solid var(--line);background:var(--surface);border-radius:14px;padding:12px 14px;cursor:pointer;font-size:1.02rem;transition:border-color .15s,background .15s}
.op:hover:not(:disabled){border-color:var(--brand)}
.op .letra{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);border:1px solid var(--line);font-weight:700}
.op.ok{border-color:var(--ok);background:var(--ok-bg)}
.op.ok .letra{background:var(--ok);color:#fff;border-color:var(--ok)}
.op.bad{border-color:var(--bad);background:var(--bad-bg);opacity:.75;text-decoration:line-through;text-decoration-color:var(--bad)}
.op:disabled{cursor:default}
.fb{border-radius:14px;padding:12px 16px;display:flex;flex-direction:column;gap:4px;animation:pop .25s ease}
.fb.ok{background:var(--ok-bg);border:1px solid var(--ok)}
.fb.bad{background:var(--bad-bg);border:1px solid var(--bad)}
.fb b{font-family:var(--f-display);font-size:1.1rem}
.fb.ok b{color:var(--ok)} .fb.bad b{color:var(--bad)}
@keyframes pop{from{transform:scale(.97);opacity:0}to{transform:none;opacity:1}}
.vf-btns{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.vf-btns .op{justify-content:center;font-family:var(--f-display);font-size:1.25rem;font-weight:800}
.ayuda{background:var(--sun-bg);color:var(--sun-ink);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;margin-bottom:16px}
.ayuda .row .btn{font-size:.95rem;padding:8px 14px}
.match{display:flex;flex-direction:column;gap:10px}
.m-row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;align-items:stretch}
.m-left{border:2px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--surface-2);font-weight:700;display:flex;align-items:center;cursor:pointer}
.m-left.sel{border-color:var(--sun);box-shadow:0 0 0 3px var(--sun-bg)}
.m-slot{border:2px dashed var(--line);border-radius:12px;min-height:52px;display:flex;align-items:center;padding:6px;cursor:pointer;transition:background .15s,border-color .15s}
.m-slot.over{border-color:var(--brand);background:var(--loc-bg)}
.m-slot.ok{border-style:solid;border-color:var(--ok);background:var(--ok-bg)}
.m-slot.bad{border-style:solid;border-color:var(--bad);background:var(--bad-bg);animation:shake .35s ease}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.m-slot .ph{color:var(--ink-3);font-size:.9rem;padding-left:6px}
.m-pool{display:flex;flex-wrap:wrap;gap:8px;padding:12px;border-radius:14px;background:var(--surface-2);border:1px solid var(--line);min-height:60px}
.m-chip{touch-action:none;user-select:none;-webkit-user-select:none;border:2px solid var(--brand);background:var(--surface);color:var(--ink);border-radius:10px;padding:8px 12px;cursor:grab;font-size:.98rem;text-align:left;line-height:1.35}
.m-chip.sel{background:var(--sun-bg);border-color:var(--sun)}
.m-slot .m-chip{width:100%;border-color:transparent;background:transparent;cursor:pointer}
.m-ghost{position:fixed;z-index:60;pointer-events:none;transform:translate(-50%,-60%) rotate(-2deg);box-shadow:0 10px 30px rgba(0,0,0,.25);max-width:280px}
@media (max-width:560px){.m-row{grid-template-columns:minmax(0,1fr)} .m-slot{min-height:46px}}
.input{width:100%;font:inherit;font-size:1.1rem;padding:12px 14px;border-radius:12px;border:2px solid var(--line);background:var(--surface);color:var(--ink)}
.input:focus{border-color:var(--brand);outline:none}
.filtros{display:flex;flex-direction:column;gap:12px;margin-bottom:18px}
.fchips{display:flex;flex-wrap:wrap;gap:8px}
.fchip{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;cursor:pointer;font-weight:700;font-size:.92rem;color:var(--ink-2)}
.fchip.on{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.fmt-cards{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));margin-bottom:22px}
.fmt-card{text-align:left;cursor:pointer;border:2px solid var(--line);background:var(--surface);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.fmt-card.on{border-color:var(--brand);box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 20%,transparent)}
.fmt-card .f-ico{font-size:1.5rem}

function hash(s) { let h = 7; for (const c of s) h = (h * 31 + c.charCodeAt(0)) | 0; return Math.abs(h) || 1; }
function barajar(n, seed) {
  const a = [...Array(n).keys()]; let h = hash(seed);
  for (let i = n - 1; i > 0; i--) { h = (h * 1103515245 + 12345) & 0x7fffffff; const j = h % (i + 1); [a[i], a[j]] = [a[j], a[i]]; }
  if (n > 1 && a.every((v, i) => v === i)) a.push(a.shift());
  return a;
}
const hoyISO = () => { const d = new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); };
const hs = k => k ? { "--hc": `var(--${HAB[k].css})`, "--hb": `var(--${HAB[k].css}-bg)` } : { "--hc": "var(--ink-2)", "--hb": "var(--surface-2)" };
const etiqueta = e => e.pregunta || (e.afirmacion ? "«" + e.afirmacion + "»" : e.instruccion);
function faltan(now) {
  const diff = new Date(C.fechaPrueba).getTime() - now;
  if (diff <= 0) return null;
  return { d: Math.floor(diff / 864e5), h: Math.floor(diff % 864e5 / 36e5), m: Math.floor(diff % 36e5 / 6e4) };
}
function useAhora(ms) { const [t, setT] = useState(Date.now()); useEffect(() => { const i = setInterval(() => setT(Date.now()), ms); return () => clearInterval(i); }, [ms]); return t; }

function guardar(p) { try { localStorage.setItem(KEY, JSON.stringify(p)); } catch (e) {} }

// ---------- gráfico de barras ----------
function BarChart({ g, claves, onNota, resaltadas = [], onBar }) {
  const W = 560, H = 340, ml = 64, mr = 16, mt = 56, mb = 70, iw = W - ml - mr, ih = H - mt - mb;
  const max = Math.ceil(Math.max(...g.datos.map(d => d.valor)) / 2) * 2 + 2;
  const y = v => mt + ih - v / max * ih;
  const bw = iw / g.datos.length;
  const cx = i => ml + bw * i + bw / 2;
  const ticks = []; for (let t = 0; t <= max; t += 2) ticks.push(t);
  const iMax = g.datos.reduce((a, d, i) => d.valor > g.datos[a].valor ? i : a, 0);
  const iMin = g.datos.reduce((a, d, i) => d.valor < g.datos[a].valor ? i : a, 0);
  const pos = { titulo: [18, 19], ejeY: [20, mt + ih / 2 - 92], ejeX: [W / 2 - 100, H - 17], max: [cx(iMax), y(g.datos[iMax].valor) - 38], min: [cx(iMin), y(g.datos[iMin].valor) - 38] };
  const nombres = { titulo: "Título", ejeY: "Eje vertical", ejeX: "Eje horizontal", max: "Valor más alto", min: "Valor más bajo" };
  return (
    <figure className="grafico">
      <svg viewBox={`0 0 ${W} ${H}`} role="img" aria-label={g.titulo}>
        <text x={W / 2 + 10} y={24} textAnchor="middle" className="g-tit">{g.titulo}</text>
        {ticks.map(t => <g key={t}><line x1={ml} x2={W - mr} y1={y(t)} y2={y(t)} className="g-grid" /><text x={ml - 8} y={y(t) + 4} textAnchor="end" className="g-tick">{t}</text></g>)}
        {g.datos.map((d, i) => {
          const hl = resaltadas.includes(d.etiqueta);
          return <g key={d.etiqueta}>
            <rect x={cx(i) - bw * 0.3} y={y(d.valor)} width={bw * 0.6} height={y(0) - y(d.valor)} rx="6" className={"g-bar" + (hl ? " hl" : "") + (onBar ? " click" : "")} onClick={onBar ? () => onBar(d.etiqueta) : undefined} />
            <text x={cx(i)} y={y(d.valor) - 8} textAnchor="middle" className="g-val">{d.valor}</text>
            <text x={cx(i)} y={mt + ih + 22} textAnchor="middle" className="g-lab">{d.etiqueta}</text>
          </g>;
        })}
        <line x1={ml} x2={W - mr} y1={y(0)} y2={y(0)} stroke="currentColor" style={{ color: "var(--ink-2)" }} strokeWidth="1.5" />
        <text x={20} y={mt + ih / 2} textAnchor="middle" className="g-eje" transform={`rotate(-90 20 ${mt + ih / 2})`}>{g.ejeY}</text>
        <text x={W / 2 + 10} y={H - 12} textAnchor="middle" className="g-eje">{g.ejeX}</text>
        {claves && g.claves.map((c, i) => {
          const [bx, by] = pos[c.en];
          return <g key={c.en} className="g-badge" role="button" tabIndex="0" onClick={() => onNota({ t: nombres[c.en], tipo: "grafico", nota: c.nota })} onKeyDown={e => { if (e.key === "Enter") onNota({ t: nombres[c.en], tipo: "grafico", nota: c.nota }); }}>
            <circle cx={bx} cy={by} r="13" /><text x={bx} y={by + 4.5} textAnchor="middle">{i + 1}</text>
          </g>;
        })}
      </svg>
    </figure>
  );
}

// ---------- texto (limpio, con claves, con pista o para marcar oraciones) ----------
function TextPanel({ texto, modo = "plain", pista = null, barra = null, onSentence = null, marca = null, onBar = null, onNota = null, notaActiva = null, aviso = null }) {
  const pistas = pista ? [].concat(pista) : [];
  const barras = barra ? [].concat(barra) : [];
  const renderPar = (par, pi) => {
    if (modo === "claves") {
      return parseClaves(par).map((s, i) => s.tipo
        ? <button key={i} className={"clave" + (s.tipo === "idea" ? " idea" : "") + (notaActiva && notaActiva.t === s.t ? " on" : "")} style={{ "--k": `var(--k-${s.tipo})` }} onClick={() => onNota(s)}>{s.t}</button>
        : <React.Fragment key={i}>{s.t}</React.Fragment>);
    }
    const plain = strip(par);
    if (onSentence) {
      return oraciones(plain).map((s, si) => {
        const st = marca && marca.pi === pi && marca.si === si ? (marca.ok ? " ok" : " bad") : "";
        return <span key={si} className={"oracion" + st} role="button" tabIndex="0" onClick={() => onSentence(pi, si, s)} onKeyDown={e => { if (e.key === "Enter") onSentence(pi, si, s); }}>{s}</span>;
      });
    }
    return resaltar(plain, pistas, pi);
  };
  return (
    <article className="texto">
      {aviso && <div className="probar-aviso">{aviso}</div>}
      <div className="texto-tipo">{texto.tipo}</div>
      <h3>{texto.titulo}</h3>
      {texto.autor && <div className="autor">{texto.autor}</div>}
      {texto.parrafos.map((par, pi) => (
        <React.Fragment key={pi}>
          <p>{renderPar(par, pi)}</p>
          {texto.grafico && texto.grafico.despuesDe === pi && <BarChart g={texto.grafico} claves={modo === "claves"} onNota={onNota} resaltadas={barras} onBar={onBar} />}
        </React.Fragment>
      ))}
      {texto.fuente && <div className="fuente">{texto.fuente}</div>}
    </article>
  );
}
function NotaSheet({ nota, onClose }) {
  useEffect(() => { const f = e => { if (e.key === "Escape") onClose(); }; window.addEventListener("keydown", f); return () => window.removeEventListener("keydown", f); }, []);
  return (
    <div className="nota-sheet" role="dialog" aria-label="Nota de la clave" style={{ "--k": `var(--k-${nota.tipo})` }}>

      <div className="n-frag">«{nota.t}»</div>

    </div>
  );
}

  const upd = fn => setP(q => { const cur = q.lecturas[id] || { claves: false, q: [] }; return { ...q, lecturas: { ...q.lecturas, [id]: fn(cur) } }; });
  const verClaves = () => { setModo("claves"); if (!est.claves) upd(c => ({ ...c, claves: true })); };
  const tipos = useMemo(() => {
    const s = new Set(); t.parrafos.forEach(par => parseClaves(par).forEach(g => g.tipo && s.add(g.tipo)));
    if (t.grafico) s.add("grafico");
    return [...s];

  const nEx = EX.filter(e => e.texto === id).length;
  if (!t) return <p>No encontré esa lectura.</p>;
  return (
    <div className="stack" style={{ gap: 20 }}>
      <div><button className="btn ghost" onClick={() => go("lecturas")}>← Todas las lecturas</button></div>
      <div className="page-head" style={{ marginBottom: 0 }}>
        <div className="eyebrow">Lectura modelo · {t.tipo}</div>
        <h1>{t.titulo}</h1>
      </div>
      <div className="row">
        <div className="tabs" role="tablist">
          <button role="tab" aria-selected={modo === "plain"} className={modo === "plain" ? "on" : ""} onClick={() => { setModo("plain"); setNota(null); }}>📄 Leer solo</button>
          <button role="tab" aria-selected={modo === "claves"} className={modo === "claves" ? "on" : ""} onClick={verClaves}>🔑 Ver claves</button>
        </div>
        {modo === "claves" && <span className="muted small">Toca lo marcado{t.grafico ? " y los círculos numerados del gráfico" : ""}.</span>}
      </div>
      {modo === "claves" && <div className="leyenda">{tipos.map(k => <span key={k} style={{ "--k": `var(--k-${k})` }}>{D.tiposClave[k].n}</span>)}</div>}
      <TextPanel texto={t} modo={modo} onNota={setNota} notaActiva={nota} />

      <section className="stack">
        <h2>Así pienso la respuesta…</h2>
        <p className="muted">Intenta responder tú primero. Después revela los pasos uno por uno.</p>
        {t.resueltas.map((r, i) => <Resuelta key={i} r={r} n={i + 1} hecha={(est.q || []).includes(i)} onHecha={() => upd(c => ({ ...c, q: [...new Set([...(c.q || []), i])] }))} />)}
      </section>

      {nEx > 0 && <div className="card row" style={{ justifyContent: "space-between" }}>
        <div><h3>Practica con este texto</h3><p className="muted small">{nEx} ejercicios usan «{t.titulo}».</p></div>
        <button className="btn" onClick={() => go("ejercicios", { texto: id })}>Ir a los ejercicios</button>
      </div>}
      {nota && <NotaSheet nota={nota} onClose={() => setNota(null)} />}

  );
}

function Resuelta({ r, n, hecha, onHecha }) {
  const total = r.pasos.length;
  const [k, setK] = useState(hecha ? total + 1 : 0);
  const avanzar = () => { const nk = k + 1; setK(nk); if (nk === total + 1) onHecha(); };
  return (
    <div className="resuelta">
      <div className="row" style={{ justifyContent: "space-between" }}><SkillChip k={r.h} /><span className="muted small">Pregunta {n}</span></div>
      <div className="q-text">{r.q}</div>
      {r.pasos.slice(0, k).map((s, i) => <div className="paso" key={i}><span>{i + 1}</span><div>{s}</div></div>)}
      {k > total && (r.rice
        ? <div className="resp"><b>Respuesta modelo con RICE:</b><RiceTexto partes={r.rice} /></div>
        : <div className="resp"><b>Respuesta: </b>{r.r}</div>)}
      {k <= total && <div><button className="btn sec" onClick={avanzar}>{k === 0 ? "Así pienso la respuesta…" : k < total ? "Siguiente paso" : "Ver respuesta"}</button></div>}
    </div>
  );
}

const FILTRO0 = { formato: "todos", habilidad: "todas", nivel: 0, texto: null };
function filtrar(f) {
  return EX.filter(e => (f.formato === "todos" || e.formato === f.formato) && (f.habilidad === "todas" || e.habilidad === f.habilidad) && (!f.nivel || e.nivel === f.nivel) && (!f.texto || e.texto === f.texto))
    .sort((a, b) => a.nivel - b.nivel);
}

function Ejercicios({ p, go, filtro, setFiltro }) {
  const lista = filtrar(filtro);
  const set = (k, v) => setFiltro(f => ({ ...f, [k]: v }));
  const fmts = ["todos", ...Object.keys(FORMATOS)];
  return (
    <div className="stack">
      <div className="page-head">
        <div className="eyebrow">Módulo 6</div>
        <h1>Zona de ejercicios</h1>
        <p>Elige un formato, una habilidad y un nivel. Cada respuesta tiene retroalimentación y la pista aparece resaltada en el texto. Puedes reintentar las veces que quieras.</p>
      </div>
      <div className="fmt-cards">
        {fmts.map(f => {
          const del = EX.filter(e => f === "todos" || e.formato === f);
          const h = del.filter(e => exHecho(p, e.id)).length;
          const info = f === "todos" ? { n: "Todos", ico: "✨", d: "Mezcla de formatos." } : FORMATOS[f];
          return (
            <button key={f} className={"fmt-card" + (filtro.formato === f ? " on" : "")} onClick={() => set("formato", f)}>
              <span className="f-ico">{info.ico}</span>
              <b>{info.n}</b>
              <span className="small muted">{info.d}</span>
              <div className="bar" style={{ "--hc": "var(--ok)" }}><span style={{ width: (del.length ? h / del.length * 100 : 0) + "%" }} /></div>
              <span className="small muted">{h} de {del.length}</span>
            </button>
          );
        })}
      </div>
      <div className="filtros">
        <div className="fchips">
          <button className={"fchip" + (filtro.habilidad === "todas" ? " on" : "")} onClick={() => set("habilidad", "todas")}>Todas las habilidades</button>
          {HAB_KEYS.map(k => <button key={k} className={"fchip" + (filtro.habilidad === k ? " on" : "")} onClick={() => set("habilidad", k)}>{HAB[k].icono} {HAB[k].nombre}</button>)}
        </div>
        <div className="fchips">
          {[0, 1, 2, 3].map(n => <button key={n} className={"fchip" + (filtro.nivel === n ? " on" : "")} onClick={() => set("nivel", n)}>{n ? NIVELES[n] : "Todos los niveles"}</button>)}
          {filtro.texto && <button className="fchip on" onClick={() => set("texto", null)}>Texto: {TX[filtro.texto].titulo} ✕</button>}
        </div>
      </div>
      {lista.length === 0 && <div className="card"><p>No hay ejercicios con esa combinación. Prueba con otro nivel o formato.</p><button className="btn sec" style={{ marginTop: 10 }} onClick={() => setFiltro(FILTRO0)}>Quitar filtros</button></div>}
      <div className="grid">
        {lista.map(e => {
          const r = p.ex[e.id];
          return (
            <button key={e.id} className="ex-card" style={hs(e.habilidad)} onClick={() => go("ex", e.id)}>
              <span className="small muted">{FORMATOS[e.formato].ico} {FORMATOS[e.formato].n}{e.variante ? " · " + e.variante : ""}</span>
              <span className="q">{etiqueta(e)}</span>
              <div className="meta"><SkillChip k={e.habilidad} /><Lvl n={e.nivel} /></div>
              {r && r.done && <span className="done-tag">{r.first ? "⭐ Correcta a la primera" : "✓ Resuelta"}</span>}
            </button>

function ExLayout({ texto, tp, children }) {
  if (!texto) return <div style={{ maxWidth: 760 }}>{children}</div>;
  return (
    <div className="ex-grid">
      <div className="ex-texto"><TextPanel texto={texto} {...tp} /></div>
      <div>{children}</div>
    </div>
  );
}

function Player({ ex, p, go, filtro, registrar, limpiarFallos }) {
  const [intentos, setIntentos] = useState(0);
  const [resuelto, setResuelto] = useState(false);
  const [primera, setPrimera] = useState(false);
  if (!ex) return <div className="card"><p>No encontré ese ejercicio.</p><button className="btn" onClick={() => go("ejercicios")}>Volver</button></div>;
  const onAttempt = ok => {
    registrar(ex, ok, intentos === 0);
    if (ok) { setResuelto(true); setPrimera(intentos === 0); }
    setIntentos(i => i + 1);
  };
  let lista = filtrar(filtro);
  if (!lista.some(e => e.id === ex.id)) lista = EX;
  const i = lista.findIndex(e => e.id === ex.id);
  const prev = lista[i - 1], next = lista[i + 1];
  const texto = ex.texto ? TX[ex.texto] : null;
  const k = ex.habilidad;
  const fallos = k ? (p.fails[k] || 0) : 0;
  const props = { ex, texto, onAttempt };
  let body;
  if (ex.formato === "mc" || (ex.formato === "vocab" && ex.tipo === "mc")) body = <MC {...props} />;
  else if (ex.formato === "match" || (ex.formato === "vocab" && ex.tipo === "match")) body = <Match {...props} />;
  else if (ex.formato === "vf") body = <VF {...props} />;
  else body = <Escribir {...props} />;
  return (
    <div className="stack" style={{ gap: 14 }}>
      <div className="row" style={{ justifyContent: "space-between" }}>
        <button className="btn ghost" onClick={() => go("ejercicios")}>← Zona de ejercicios</button>
        <span className="muted small">{i + 1} de {lista.length}</span>
      </div>
      <div className="row">
        <span className="chip">{FORMATOS[ex.formato].ico} {FORMATOS[ex.formato].n}{ex.variante ? " · " + ex.variante : ""}</span>
        <SkillChip k={k} /><Lvl n={ex.nivel} />
      </div>
      {!resuelto && fallos >= 2 && (
        <div className="ayuda">
          <b>{HAB[k].nombre} te está costando un poco. ¡Es normal, así se aprende!</b>
          <span>¿Quieres repasar antes de seguir?</span>
          <div className="row">
            <button className="btn sun" onClick={() => { limpiarFallos(k); go("ficha", k); }}>Repasar la ficha APRENDE</button>
            <button className="btn sec" onClick={() => { limpiarFallos(k); go("lectura", D.fichas[k].modelo); }}>Ver la lectura modelo</button>
            <button className="btn ghost" onClick={() => limpiarFallos(k)}>Seguir intentando</button>
          </div>
        </div>
      )}
      {body}
      {resuelto && primera && <div className="chip sun celebra" style={{ alignSelf: "flex-start" }}>⭐ ¡A la primera! Racha: {p.streak} 🔥</div>}
      <div className="player-nav">
        <button className="btn sec" disabled={!prev} onClick={() => prev && go("ex", prev.id)}>← Anterior</button>
        {next
          ? <button className={"btn" + (resuelto ? " sun" : " sec")} onClick={() => go("ex", next.id)}>Siguiente ejercicio →</button>
          : <button className="btn" onClick={() => go("ejercicios")}>Volver a la lista</button>}
      </div>
    </div>
  );
}

// ----- a) Opción múltiple (también vocabulario) -----
function MC({ ex, texto, onAttempt }) {
  const [malas, setMalas] = useState([]);
  const [ok, setOk] = useState(false);
  const [ult, setUlt] = useState(null);
  const elegir = i => {
    if (ok || malas.includes(i)) return;
    setUlt(i);
    if (i === ex.ok) { setOk(true); onAttempt(true); }
    else { setMalas(m => [...m, i]); onAttempt(false); }
  };
  const ver = ok || malas.length > 0;
  return (
    <ExLayout texto={texto} tp={{ pista: ver ? ex.pista : null, barra: ver ? ex.barra : null }}>
      <div className="q-card">
        <div className="q-text">{ex.pregunta}</div>
        <div className="ops">
          {ex.op.map((o, i) => (
            <button key={i} className={"op" + (ok && i === ex.ok ? " ok" : "") + (malas.includes(i) ? " bad" : "")} disabled={ok || malas.includes(i)} onClick={() => elegir(i)}>
              <span className="letra">{"abcd"[i]}</span><span>{o.t}</span>
            </button>
          ))}
        </div>
        {ult !== null && !ok && <Feedback tipo="bad" titulo="Todavía no">{ex.op[ult].fb} {texto ? "Mira la parte resaltada del texto y vuelve a intentarlo." : "Vuelve a intentarlo."}</Feedback>}
        {ok && <Feedback tipo="ok" titulo={malas.length ? "¡Ahora sí!" : "¡Correcto!"}>{ex.exp}</Feedback>}
      </div>
    </ExLayout>
  );
}

// ----- b) Unir columnas: arrastrar (dedo o mouse) o tocar para emparejar -----
function Match({ ex, texto, onAttempt }) {
  const n = ex.pares.length;
  const orden = useMemo(() => barajar(n, ex.id), [ex.id, n]);
  const [asig, setAsig] = useState({});
  const [sel, setSel] = useState(null);
  const [selL, setSelL] = useState(null);
  const [estado, setEstado] = useState({});
  const [listo, setListo] = useState(false);
  const [msg, setMsg] = useState(null);
  const [drag, setDrag] = useState(null);
  const [over, setOver] = useState(null);
  const dragRef = useRef(null), justDragged = useRef(false), fns = useRef({});

  const colocar = (l, r) => {
    if (listo || estado[l] === "ok") return;
    setAsig(a => { const b = { ...a }; Object.keys(b).forEach(x => { if (b[x] === r) delete b[x]; }); b[l] = r; return b; });
    setEstado(e => { const x = { ...e }; if (x[l] === "bad") delete x[l]; return x; });
    setSel(null); setSelL(null); setMsg(null);
  };
  const quitar = r => setAsig(a => { const b = { ...a }; Object.keys(b).forEach(x => { if (b[x] === r && estado[x] !== "ok") delete b[x]; }); return b; });
  fns.current = { colocar, quitar };

  useEffect(() => {
    const slotEn = (x, y) => { const el = document.elementFromPoint(x, y); return el ? el.closest("[data-slot],[data-pool]") : null; };
    const move = e => {
      const s = dragRef.current; if (!s) return;
      if (!s.moved && Math.hypot(e.clientX - s.x0, e.clientY - s.y0) > 8) s.moved = true;
      if (s.moved) { setDrag({ r: s.r, x: e.clientX, y: e.clientY }); const t = slotEn(e.clientX, e.clientY); setOver(t && t.dataset.slot !== undefined ? +t.dataset.slot : null); }
    };
    const up = e => {
      const s = dragRef.current; if (!s) return; dragRef.current = null;
      if (s.moved) {
        justDragged.current = true; setTimeout(() => { justDragged.current = false; }, 60);
        const t = slotEn(e.clientX, e.clientY);
        if (t && t.dataset.slot !== undefined) fns.current.colocar(+t.dataset.slot, s.r);
        else if (t && t.dataset.pool !== undefined) fns.current.quitar(s.r);
      }
      setDrag(null); setOver(null);
    };
    const cancel = () => { dragRef.current = null; setDrag(null); setOver(null); };
    window.addEventListener("pointermove", move);
    window.addEventListener("pointerup", up);
    window.addEventListener("pointercancel", cancel);
    return () => { window.removeEventListener("pointermove", move); window.removeEventListener("pointerup", up); window.removeEventListener("pointercancel", cancel); };
  }, []);

  const down = (e, r) => { if (listo) return; if (e.pointerType === "mouse" && e.button !== 0) return; dragRef.current = { r, x0: e.clientX, y0: e.clientY, moved: false }; };
  const tapChip = r => { if (justDragged.current || listo) return; if (selL !== null) colocar(selL, r); else setSel(sel === r ? null : r); };
  const tapSlot = l => {
    if (justDragged.current || listo || estado[l] === "ok") return;
    if (sel !== null) colocar(l, sel);
    else if (asig[l] !== undefined) quitar(asig[l]);
    else setSelL(selL === l ? null : l);
  };
  const revisar = () => {
    const est = {}; let bien = 0;
    for (let l = 0; l < n; l++) { const b = asig[l] === l; est[l] = b ? "ok" : "bad"; if (b) bien++; }
    setEstado(est);
    const todo = bien === n;
    onAttempt(todo);
    if (todo) { setListo(true); setMsg({ tipo: "ok", t: ex.exp }); }
    else {
      setMsg({ tipo: "bad", t: `Tienes ${bien} de ${n} parejas bien. Las incorrectas vuelven a la bandeja: inténtalo otra vez.` });
      setTimeout(() => {
        setAsig(a => { const b = {}; Object.keys(a).forEach(x => { if (a[x] === +x) b[x] = a[x]; }); return b; });
        setEstado(e => { const x = {}; Object.keys(e).forEach(y => { if (e[y] === "ok") x[y] = "ok"; }); return x; });
      }, 1300);
    }
  };
  const usados = Object.values(asig);
  const libres = orden.filter(r => !usados.includes(r));
  const chip = (r, enSlot, fijo) => (
    <div key={r} className={"m-chip" + (sel === r ? " sel" : "")} role="button" tabIndex={fijo ? -1 : 0}
      onPointerDown={fijo ? undefined : e => down(e, r)}
      onClick={enSlot ? undefined : () => tapChip(r)}
      onKeyDown={enSlot ? undefined : e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); tapChip(r); } }}>
      {ex.pares[r].b}
    </div>
  );
  return (
    <ExLayout texto={texto} tp={{}}>
      <div className="q-card">
        <div className="q-text">{ex.instruccion}</div>
        <p className="muted small">Arrastra cada tarjeta hasta su pareja, o toca una tarjeta y después el espacio vacío.</p>
        <div className="match">
          {ex.pares.map((pr, l) => (
            <div className="m-row" key={l}>
              <div className={"m-left" + (selL === l ? " sel" : "")} onClick={() => tapSlot(l)}>{pr.a}</div>
              <div data-slot={l} className={"m-slot" + (over === l ? " over" : "") + (estado[l] ? " " + estado[l] : "")} onClick={() => tapSlot(l)}
                role="button" tabIndex={0} onKeyDown={e => { if (e.key === "Enter") tapSlot(l); }}>
                {asig[l] !== undefined ? chip(asig[l], true, estado[l] === "ok" || listo) : <span className="ph">{sel !== null ? "Toca aquí para dejarla" : "Suelta aquí"}</span>}
              </div>
            </div>
          ))}
        </div>
        {!listo && <div className="m-pool" data-pool="1">{libres.length ? libres.map(r => chip(r, false, false)) : <span className="muted small">¡Todas ubicadas! Revisa tus parejas.</span>}</div>}
        {!listo && <div><button className="btn" disabled={usados.length < n} onClick={revisar}>Revisar parejas</button></div>}
        {msg && <Feedback tipo={msg.tipo} titulo={msg.tipo === "ok" ? "¡Todas correctas!" : "Casi…"}>{msg.t}</Feedback>}
      </div>
      {drag && <div className="m-chip m-ghost" style={{ left: drag.x, top: drag.y }}>{ex.pares[drag.r].b}</div>}
    </ExLayout>
  );
}

// ----- c) Verdadero o falso (con corrección y prueba en el texto) -----
function VF({ ex, texto, onAttempt }) {
  const [fase, setFase] = useState("responder");
  const [msg, setMsg] = useState(null);
  const [malasCorr, setMalasCorr] = useState([]);
  const [marca, setMarca] = useState(null);
  const [elegido, setElegido] = useState(null);
  const conBarras = !!ex.barras;
  const responder = v => {
    if (fase !== "responder") return;
    setElegido(v);
    if (v !== ex.v) { setMsg({ tipo: "bad", titulo: "Revisa otra vez", t: v ? "Busca en el texto: hay una parte que no coincide con la afirmación." : "Busca en el texto: sí dice eso." }); onAttempt(false); return; }
    if (ex.v) { setFase("listo"); setMsg({ tipo: "ok", titulo: "¡Correcto, es verdadero!", t: ex.exp }); onAttempt(true); }
    else { setFase("corregir"); setMsg({ tipo: "ok", titulo: "¡Bien, es falso!", t: "Ahora elige la corrección." }); }
  };
  const corregir = i => {
    if (malasCorr.includes(i)) return;
    if (i === ex.okCorr) { setFase("probar"); setMsg({ tipo: "ok", titulo: "Exacto.", t: conBarras ? "Último paso: toca en el gráfico una barra que lo demuestre." : "Último paso: toca en el texto la oración que lo demuestra." }); }
    else { setMalasCorr(m => [...m, i]); setMsg({ tipo: "bad", titulo: "Esa corrección no calza", t: "Vuelve al texto y compara." }); onAttempt(false); }
  };
  const terminar = () => { setFase("listo"); setMsg({ tipo: "ok", titulo: "¡Lo demostraste!", t: ex.exp }); onAttempt(true); };
  const probarOracion = (pi, si, s) => {
    if (fase !== "probar") return;
    const ok = s.includes(ex.prueba);
    setMarca({ pi, si, ok });
    if (ok) terminar(); else setMsg({ tipo: "bad", titulo: "Esa oración no lo demuestra", t: "Busca otra: debe decir lo que escribiste en la corrección." });
  };
  const probarBarra = et => {
    if (fase !== "probar") return;
    if (ex.barras.includes(et)) terminar(); else setMsg({ tipo: "bad", titulo: "Esa barra no sirve", t: "Busca las barras que se comparan en la afirmación." });
  };
  const tp = fase === "probar"
    ? (conBarras ? { onBar: probarBarra, aviso: "👆 Toca la barra que lo demuestra" } : { onSentence: probarOracion, marca, aviso: "👆 Toca la oración que lo demuestra" })
    : fase === "listo" ? (conBarras ? { barra: ex.barras } : { pista: ex.prueba }) : {};
  return (
    <ExLayout texto={texto} tp={tp}>
      <div className="q-card">
        <div className="eyebrow">¿Verdadero o falso?</div>
        <div className="q-text">«{ex.afirmacion}»</div>
        <div className="vf-btns">
          {[true, false].map(v => (
            <button key={String(v)} className={"op" + (fase !== "responder" && v === ex.v ? " ok" : "") + (fase === "responder" && elegido === v && v !== ex.v ? " bad" : "")} disabled={fase !== "responder"} onClick={() => responder(v)}>
              {v ? "Verdadero" : "Falso"}
            </button>
          ))}
        </div>
        {(fase === "corregir" || ((fase === "probar" || fase === "listo") && !ex.v)) && (
          <div className="stack" style={{ gap: 8 }}>
            <b>¿Cuál es la afirmación correcta?</b>
            <div className="ops">
              {ex.corr.map((c, i) => (
                <button key={i} className={"op" + (fase !== "corregir" && i === ex.okCorr ? " ok" : "") + (malasCorr.includes(i) ? " bad" : "")} disabled={fase !== "corregir" || malasCorr.includes(i)} onClick={() => corregir(i)}>
                  <span className="letra">{"abc"[i]}</span><span>{c}</span>
                </button>
              ))}
            </div>
          </div>
        )}
        {msg && <Feedback tipo={msg.tipo} titulo={msg.titulo}>{msg.t}</Feedback>}
      </div>
    </ExLayout>
  );
}

// ----- d) Vocabulario: escribir un sinónimo -----
const norm = s => s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^a-z]/g, "");
function Escribir({ ex, texto, onAttempt }) {
  const [v, setV] = useState("");
  const [fallos, setFallos] = useState(0);
  const [ok, setOk] = useState(false);
  const [msg, setMsg] = useState(null);
  const revisar = e => {
    e.preventDefault();
    const r = norm(v); if (!r || ok) return;
    if (ex.aceptadas.map(norm).includes(r)) { setOk(true); setMsg({ tipo: "ok", titulo: "¡Muy bien!", t: ex.exp }); onAttempt(true); return; }
    if (ex.pista && r === norm(ex.pista)) { setMsg({ tipo: "bad", titulo: "Esa es la misma palabra", t: "Busca otra que signifique lo mismo." }); return; }
    const f = fallos + 1; setFallos(f); onAttempt(false);
    setMsg({ tipo: "bad", titulo: "No está en mi lista", t: (f >= 2 && ex.ayuda ? ex.ayuda + " " : "Prueba ponerla en la oración: ¿se mantiene el sentido? ") + "Si estás seguro de que tu palabra funciona, muéstrasela a un adulto: ¡podría estar bien!" });
  };
  return (
    <ExLayout texto={texto} tp={{ pista: ex.pista }}>
      <form className="q-card" onSubmit={revisar}>
        <div className="q-text">{ex.pregunta}</div>
        <label htmlFor={"in-" + ex.id} className="small muted">Tu sinónimo:</label>
        <input id={"in-" + ex.id} className="input" value={v} onChange={e => setV(e.target.value)} disabled={ok} autoComplete="off" autoCapitalize="none" spellCheck="false" />
        {!ok && <div><button className="btn" type="submit">Revisar</button></div>}
        {msg && <Feedback tipo={msg.tipo} titulo={msg.titulo}>{msg.t}</Feedback>}
        {ok && <p className="small muted">Otras opciones válidas: {ex.aceptadas.slice(0, 6).join(", ")}.</p>}
      </form>
    </ExLayout>
  );
}

// =====================================================================
// MÓDULO 11 · PLAN DE 5 DÍAS
// =====================================================================
function Plan({ p, setP, go, param }) {
  const hoy = hoyISO();
  useEffect(() => {
    if (param === null || param === undefined) return;
    const el = document.getElementById("dia-" + param);
    if (el) setTimeout(() => el.scrollIntoView({ behavior: "smooth", block: "start" }), 60);
  }, [param]);
  const toggle = id => setP(q => ({ ...q, plan: { ...q.plan, [id]: !q.plan[id] } }));
  return (
    <div className="stack" style={{ gap: 18 }}>
      <div className="page-head">
        <div className="eyebrow">Módulo 11</div>
        <h1>Plan de 5 días</h1>
        <p>Del sábado 26 al miércoles 30 de septiembre. Sesiones de 25 a 30 minutos. Marca cada tarea al terminarla; el botón «Ir» te lleva directo al módulo.</p>
      </div>
      {D.plan.map((d, di) => {
        const reales = d.tareas.filter(t => !t.etapa);
        const hechas = reales.filter(t => p.plan[t.id]).length;
        const mins = d.tareas.reduce((a, t) => a + t.min, 0);
        return (
          <section key={d.fecha} id={"dia-" + di} className={"dia" + (d.fecha === hoy ? " hoy" : "")} style={{ scrollMarginTop: 80 }}>
            <div className="dia-head">
              <div>
                <div className="eyebrow">Día {di + 1} · {d.dia}{d.fecha === hoy ? " · HOY" : ""}</div>
                <h3>{d.titulo}</h3>
              </div>
              <span className={diaHecho(p, d) ? "pill-ok" : "muted small"}>{diaHecho(p, d) ? "✓ Día completo" : `${hechas}/${reales.length} · ~${mins} min`}</span>
            </div>
            {d.nota && <p className="small muted">{d.nota}</p>}
            {d.tareas.map(t => (
              <div key={t.id} className={"tarea" + (p.plan[t.id] ? " hecha" : "")}>
                <input type="checkbox" id={"t-" + t.id} checked={!!p.plan[t.id]} disabled={!!t.etapa} onChange={() => toggle(t.id)} />
                <label htmlFor={"t-" + t.id}>{t.t}{t.etapa ? <span className="etapa2">Etapa 2</span> : null}</label>
                <span className="min">{t.min} min</span>
                <button className="btn sec" style={{ padding: "6px 12px", fontSize: ".9rem" }} onClick={() => go(t.ir[0], t.ir[1])}>Ir</button>
              </div>
            ))}
          </section>
        );
      })}
    </div>
  );
}

// APP: navegación, progreso, medallas
// =====================================================================
function Nav({ active, go }) {
  return (
    <nav aria-label="Módulos">
      {MODULOS.map(m => (
        <button key={m.id} className={"nav-item" + (active === m.id ? " on" : "")} onClick={() => go(m.id)}>
          <span className="ico">{m.ico}</span>{m.n}{m.etapa ? <span className="etq">Pronto</span> : null}
        </button>
      ))}
    </nav>
  );
}

function App() {
  const [p, setP] = useState(cargar);
  useEffect(() => guardar(p), [p]);
  const [route, setRoute] = useState({ view: "inicio", param: null });
  const [menu, setMenu] = useState(false);
  const [confirmReset, setConfirmReset] = useState(false);
  const [toast, setToast] = useState(null);
  const [filtro, setFiltro] = useState(FILTRO0);
  const ahora = useAhora(60000);
  const f = faltan(ahora);

  const go = (view, param = null) => {
    if (view === "ejercicios" && param && typeof param === "object") { setFiltro({ ...FILTRO0, ...param }); param = null; }
    setRoute({ view, param }); setMenu(false);
    window.scrollTo(0, 0);
  };

  useEffect(() => {
    const nuevas = MEDALLAS.filter(m => !p.medallas.includes(m.id) && m.test(p));
    if (nuevas.length) {
      setP(q => ({ ...q, medallas: [...q.medallas, ...nuevas.map(m => m.id).filter(id => !q.medallas.includes(id))] }));
      setToast(nuevas[0]);
    }
  }, [p]);
  useEffect(() => { if (!toast) return; const t = setTimeout(() => setToast(null), 4000); return () => clearTimeout(t); }, [toast]);

  const registrar = (ex, correcto, primerIntento) => setP(q => {
    const n = { ...q, ex: { ...q.ex }, fails: { ...q.fails } };
    const prev = q.ex[ex.id] || {};
    const first = prev.first !== undefined ? prev.first : (correcto && primerIntento);
    const k = ex.habilidad;
    if (correcto) {
      n.ex[ex.id] = { done: true, first };
      if (primerIntento) { n.streak = q.streak + 1; n.best = Math.max(q.best, n.streak); if (k) n.fails[k] = 0; }
    } else {
      n.ex[ex.id] = { ...prev, done: !!prev.done, first };
      if (primerIntento) n.streak = 0;
      if (k) n.fails[k] = (q.fails[k] || 0) + 1;
    }
    return n;
  });
  const limpiarFallos = k => setP(q => ({ ...q, fails: { ...q.fails, [k]: 0 } }));
  const reiniciar = () => { setP(nuevo()); setFiltro(FILTRO0); setConfirmReset(false); go("inicio"); };

  const { view, param } = route;
  const props = { p, setP, go };
  let vista;
  switch (view) {
    case "inicio": vista = <Inicio {...props} />; break;
    case "aprende": vista = <Aprende {...props} />; break;
    case "ficha": vista = <Ficha key={param} k={param} {...props} />; break;
    case "lecturas": vista = <Lecturas {...props} />; break;
    case "lectura": vista = <Lectura key={param} id={param} {...props} />; break;
    case "claves10": vista = <Claves10 {...props} />; break;
    case "ejercicios": vista = <Ejercicios {...props} filtro={filtro} setFiltro={setFiltro} />; break;
    case "ex": vista = <Player key={param} ex={EXMAP[param]} {...props} filtro={filtro} registrar={registrar} limpiarFallos={limpiarFallos} />; break;
    case "plan": vista = <Plan {...props} param={param} />; break;
    default: vista = <Proximamente id={view} {...props} />;
  }
  const active = PADRE[view] || view;
  const pie = (
    <div className="side-foot">
      <div className="small muted">Tu progreso se guarda en este navegador.</div>
      <button className="btn sec" onClick={() => { setMenu(false); setConfirmReset(true); }}>↺ Reiniciar progreso</button>
    </div>
  );

  return (
    <>
      <header className="topbar">
        <button className="btn-menu" onClick={() => setMenu(true)} aria-label="Abrir menú">☰ Menú</button>
        <button className="logo" onClick={() => go("inicio")}><span className="logo-mark">📖</span><span>Misión Lectora</span></button>
        <div className="top-spacer" />
        <span className="chip sun" title="Respuestas correctas seguidas a la primera">🔥 {p.streak}</span>
        {f && <span className="chip hide-sm">Faltan {f.d > 0 ? f.d + (f.d === 1 ? " día" : " días") : f.h + " h"}</span>}
      </header>
      <div className="layout">
        <aside className="side"><Nav active={active} go={go} />{pie}</aside>
        <main className="main">{vista}</main>
      </div>
      {menu && <>
        <div className="drawer-bg" onClick={() => setMenu(false)} />
        <aside className="drawer"><Nav active={active} go={go} />{pie}</aside>
      </>}
      {confirmReset && (
        <div className="modal-bg" onClick={() => setConfirmReset(false)}>
          <div className="modal" role="dialog" aria-modal="true" onClick={e => e.stopPropagation()}>
            <h2>¿Reiniciar todo?</h2>
            <p className="muted">Se borrarán tus ejercicios, medallas, racha y el plan marcado. No se puede deshacer.</p>
            <div className="row" style={{ justifyContent: "flex-end" }}>
              <button className="btn sec" onClick={() => setConfirmReset(false)}>Cancelar</button>
              <button className="btn" style={{ background: "var(--bad)", color: "#fff" }} onClick={reiniciar}>Sí, reiniciar</button>
            </div>
          </div>
        </div>
      )}
      {toast && <div className="toast" role="status"><span className="t-ico">{toast.ico}</span><div><b>¡Nueva medalla!</b><div>{toast.n}</div></div></div>}
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
